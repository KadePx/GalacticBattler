# Cloudflare Pages config for itskade.space (project "galactic-battler").
# The site itself is built by `npm run build` into dist/; functions/ adds the API.
name = "galactic-battler"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-01"

# Snapshot PvP: shared ghost pool used by functions/api/ghosts.ts.
[[d1_databases]]
binding = "DB"
database_name = "galactic-ghosts"
database_id = "b442a793-c782-49ca-a339-99fc2750f230"

# Commonworld: /api/cw/* talks to the live world Durable Object in worker "commonworld-world"
# (workers/commonworld). Deploy that worker before changing this binding.
[[durable_objects.bindings]]
name = "WORLD"
class_name = "WorldDO"
script_name = "commonworld-world"

# Hollow Lands: /api/hl/* talks to the colony and region Durable Objects in worker
# "hollowlands-colony" (workers/hollowlands). Deploy that worker before changing these bindings.
[[durable_objects.bindings]]
name = "COLONY"
class_name = "ColonyDO"
script_name = "hollowlands-colony"

[[durable_objects.bindings]]
name = "REGION"
class_name = "RegionDO"
script_name = "hollowlands-colony"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Hollow Lands: a small colony in a harsh fantasy world that lives on its own. Look in on who loves, hates and mourns whom." />
    <meta name="description" content="Hollow Lands: a harsh fantasy land of small colonies that live on their own. Make one colonist and watch their life unfold." />
    <meta property="og:title" content="Hollow Lands" />
    <meta property="og:description" content="A shared land of small colonies that live on their own. Make one colonist and watch their life unfold." />
    <meta property="og:image" content="https://itskade.space/thumbs/hollow-lands.svg" />
    <title>Hollow Lands</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310141e'/%3E%3Cpath d='M6 24 16 7l10 17z' fill='%237c8cff'/%3E%3Ccircle cx='16' cy='20' r='3' fill='%2310141e'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Same visual direction as Commonworld: slate surfaces, one periwinkle accent, Inter. */
      :root {
        --bg: #0a0d14;
        --surface: rgba(13, 17, 26, 0.82);
        --solid: #10141e;
        --raise: rgba(255, 255, 255, 0.04);
        --raise2: rgba(255, 255, 255, 0.08);
        --line: rgba(255, 255, 255, 0.08);
        --line2: rgba(255, 255, 255, 0.16);
        --ink: #eef1f7;
        --dim: #9aa4b8;
        --faint: #636c80;
        --accent: #7c8cff;
        --accent2: #a5b0ff;
        --accentInk: #0b0e1a;
        --accentSoft: rgba(124, 140, 255, 0.14);
        --good: #4ade80;
        --bad: #f87171;
        --font: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        --r: 14px;
        --shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.55);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; font-feature-settings: 'cv11', 'ss01'; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      a { color: var(--accent2); text-decoration: none; cursor: pointer; } a:hover { text-decoration: underline; }
      .hidden { display: none !important; }
      #map { position: fixed; inset: 0; }
      #map canvas { display: block; cursor: grab; }
      ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: var(--raise2); border-radius: 8px; } ::-webkit-scrollbar-track { background: transparent; }

      /* Surfaces and controls */
      .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); }
      .btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 10px; background: var(--raise); border: 1px solid var(--line); font-size: 13.5px; font-weight: 500; white-space: nowrap; transition: background 0.15s, border-color 0.15s; }
      .btn:hover { background: var(--raise2); border-color: var(--line2); }
      .btn.on { border-color: var(--accent); color: var(--accent2); background: var(--accentSoft); }
      .btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
      .icon { width: 30px; height: 30px; flex: none; display: inline-grid; place-items: center; border-radius: 9px; background: var(--raise); border: 1px solid var(--line); font-size: 15px; line-height: 1; color: var(--dim); transition: background 0.15s; }
      .icon:hover { background: var(--raise2); color: var(--ink); }
      .chip { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--raise); border: 1px solid var(--line); font-size: 12px; font-weight: 500; color: var(--ink); }
      button.chip:hover { border-color: var(--line2); background: var(--raise2); }
      .chip.on { border-color: var(--accent); color: var(--accent2); background: var(--accentSoft); }
      .chip:disabled { opacity: 0.4; cursor: default; }
      .chips, .filters, .flags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
      .filters { margin-bottom: 10px; }
      .flags { margin-top: 12px; }
      .up { color: var(--good); } .down { color: var(--bad); }
      .hint { color: var(--faint); font-size: 12.5px; margin-top: 6px; }
      .legend { color: var(--faint); font-size: 11.5px; text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 6px; }
      h3 { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin: 22px 0 8px; }
      .seg { display: flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--raise); border: 1px solid var(--line); }
      .seg button { height: 28px; padding: 0 11px; color: var(--dim); border-radius: 8px; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .seg button:hover { color: var(--ink); background: var(--raise); }
      .seg button.on { background: var(--raise2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line2); }
      svg.pt { display: block; flex: none; border-radius: 22%; }
      .gone svg.pt { filter: grayscale(0.85) brightness(0.9); }

      /* Top bar */
      #top { position: fixed; top: 12px; left: 12px; padding: 8px 10px 8px 16px; display: flex; align-items: center; column-gap: 14px; row-gap: 4px; flex-wrap: wrap; max-width: calc(100vw - 230px); z-index: 2; }
      #top .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
      #top .brand::before { content: ''; width: 14px; height: 14px; border-radius: 50%; background: conic-gradient(from 200deg, #a5b0ff, #7c8cff, #4f5bd5, #a5b0ff); box-shadow: 0 0 12px rgba(124, 140, 255, 0.5); }
      #cname { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
      #cdate { font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
      #cstats { display: flex; gap: 12px; color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      #cstats b { font-weight: 600; color: var(--ink); }
      #cstats .down b { color: var(--bad); }

      /* Left panel: feed, people, colony */
      #side { position: fixed; left: 12px; top: var(--top, 68px); bottom: 12px; width: 348px; display: flex; flex-direction: column; overflow: hidden; z-index: 2; }
      #side.shut { bottom: auto; }
      #side.shut .db { display: none; }
      #side.shut .dh { border-bottom: 0; }
      .dh { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 12px; border-bottom: 1px solid var(--line); }
      .dh .t { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 4px; }
      .dh .seg { flex: 1; }
      .dh .seg button { flex: 1; }
      .db { overflow-y: auto; padding: 12px 14px 28px; flex: 1; min-height: 0; overscroll-behavior: contain; }

      /* Right drawer: the card for a colonist, a building or the dead */
      #card { position: fixed; right: 12px; top: var(--top, 68px); bottom: 12px; width: 400px; display: flex; flex-direction: column; overflow: hidden; z-index: 3; }
      #card .db { padding: 14px 16px 32px; }

      /* Rows and lines */
      .row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; cursor: pointer; transition: background 0.12s; }
      .row:hover, .row.sel { background: var(--raise); }
      .row.sel { box-shadow: inset 0 0 0 1px rgba(124, 140, 255, 0.45); }
      .row.empty { cursor: default; opacity: 0.6; }
      .row .n { flex: 1; min-width: 0; }
      .row .n b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row .n small { display: block; color: var(--faint); font-size: 12px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row .n small.plain { color: var(--dim); }
      .row .v { color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; font-size: 13px; font-weight: 600; white-space: nowrap; }
      .row .v small { display: block; color: var(--faint); font-weight: 400; font-size: 11.5px; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
      .cen { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--faint); margin: 16px 0 4px; text-transform: uppercase; }
      .cen:first-of-type { margin-top: 4px; }
      .ln { display: flex; gap: 10px; padding: 4px 6px; border-radius: 8px; }
      .ln .y { color: var(--faint); font-size: 12px; min-width: 40px; text-align: right; padding-top: 1.5px; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
      .ln .t { flex: 1; color: var(--dim); min-width: 0; }
      .ln.w2 .t { color: var(--ink); }
      .ln.w3 .t { color: var(--ink); font-weight: 600; }
      .ln.w3 { background: var(--accentSoft); }
      a.who { color: inherit; border-bottom: 1px solid rgba(165, 176, 255, 0.5); }
      a.who:hover { color: var(--accent2); text-decoration: none; border-color: var(--accent2); }

      /* Cards */
      .head { display: flex; gap: 14px; align-items: flex-start; }
      .head .hd { flex: 1; min-width: 0; }
      .head .nm { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
      .head .sub { color: var(--dim); font-size: 12.5px; margin-top: 3px; }
      .head .btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
      .tie { display: inline-block; padding: 0 7px; border-radius: 99px; font-size: 11px; font-weight: 600; line-height: 18px; margin-left: 6px; background: var(--raise2); color: var(--dim); white-space: nowrap; }
      .flags .tie { margin-left: 0; font-size: 12px; line-height: 22px; padding: 0 10px; }
      .tie.love { background: rgba(232, 82, 122, 0.16); color: #f59ab4; }
      .tie.kin { background: var(--accentSoft); color: var(--accent2); }
      .tie.good { background: rgba(74, 222, 128, 0.13); color: var(--good); }
      .tie.bad { background: rgba(248, 113, 113, 0.14); color: var(--bad); }
      .bar { position: relative; height: 6px; border-radius: 4px; background: var(--raise2); }
      .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; transition: width 0.3s; }
      .bar s { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--ink); opacity: 0.6; }
      .moodrow { display: flex; align-items: center; gap: 12px; }
      .moodrow b { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 34px; letter-spacing: -0.02em; }
      .moodrow .bar { flex: 1; height: 10px; border-radius: 6px; }
      .moodrow .bar i { border-radius: 6px; }
      .needs, .skills { display: grid; grid-template-columns: 78px 1fr 44px; gap: 7px 10px; align-items: center; font-size: 13px; }
      .needs span, .skills span { color: var(--dim); }
      .needs b, .skills b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
      .pas { color: var(--accent2); font-size: 9px; letter-spacing: 1px; vertical-align: 1px; }
      .now { display: flex; flex-direction: column; background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
      .now b { font-weight: 600; }
      .now span { color: var(--dim); font-size: 12.5px; }
      .th { display: flex; gap: 10px; justify-content: space-between; padding: 3px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
      .th span { color: var(--dim); min-width: 0; }
      .th b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .th.dimrow { border-bottom: 0; padding-top: 6px; }
      .hurts { margin-top: 10px; }
      .th.dimrow span { color: var(--faint); }
      .note { font-size: 13px; color: var(--dim); margin-top: 8px; }
      .note b { color: var(--ink); font-weight: 600; }
      .note .lbl { display: block; font-size: 11px; color: var(--faint); }
      .rel { border-radius: 10px; }
      .rel.open { background: var(--raise); }
      .relh { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 10px; cursor: pointer; }
      .relh:hover { background: var(--raise); }
      .relh .n { flex: 1; min-width: 0; font-weight: 500; line-height: 1.7; }
      .relh b { font-variant-numeric: tabular-nums; font-weight: 600; }
      .relh .v { color: var(--faint); font-size: 12px; }
      .relh .chev { width: 14px; text-align: center; color: var(--faint); }
      .relb { padding: 2px 12px 10px 48px; }
      .epitaph { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; margin-top: 14px; background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
      .epitaph b { font-weight: 600; }
      .epitaph span { color: var(--dim); font-size: 12.5px; }
      .epitaph .btn { margin-top: 8px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .stat { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
      .stat b { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
      .stat span { color: var(--faint); font-size: 11.5px; }
      .store { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
      .db > .btn.sm { margin-top: 10px; }

      #loading { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; background: var(--bg); color: var(--faint); letter-spacing: 0.3em; font-size: 12px; font-weight: 600; z-index: 20; transition: opacity 0.4s; }
      #loading small { letter-spacing: 0.02em; font-weight: 400; font-size: 12.5px; }
      #loading.done { opacity: 0; pointer-events: none; }

      /* My colonist: the button, the arrival toast and the memorial banner */
      #mine { position: fixed; top: 12px; right: 12px; z-index: 2; height: 46px; padding: 0 18px; border-radius: var(--r); font-weight: 600; font-size: 14px; background: var(--accent); color: var(--accentInk); border: 1px solid transparent; box-shadow: var(--shadow); white-space: nowrap; transition: background 0.15s; }
      #mine:hover { background: var(--accent2); }
      #mine.has { background: var(--surface); color: var(--accent2); border-color: rgba(124, 140, 255, 0.45); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      #mine.has:hover { background: var(--solid); }
      #mine.wait { opacity: 0.75; cursor: default; }
      #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 10px 18px; z-index: 6; font-weight: 500; max-width: calc(100vw - 24px); text-align: center; transition: opacity 0.3s; pointer-events: none; }
      #toast.off { opacity: 0; }
      #memorial { position: fixed; top: var(--top, 68px); left: 50%; transform: translateX(-50%); z-index: 3; padding: 10px 10px 10px 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; width: max-content; max-width: min(560px, calc(100vw - 24px)); }
      #memorial .t { flex: 1 1 220px; font-size: 13.5px; color: var(--dim); }
      #memorial .t b { color: var(--ink); font-weight: 600; }
      .btn.go { background: var(--accent); color: var(--accentInk); border-color: transparent; font-weight: 600; }
      .btn.go:hover { background: var(--accent2); }
      .btn.big { height: 42px; padding: 0 22px; font-size: 15px; }
      .btn:disabled, .icon:disabled { opacity: 0.35; cursor: default; }

      /* Character creator */
      #creator { position: fixed; inset: 0; z-index: 30; background: rgba(8, 10, 16, 0.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; justify-content: center; padding: 20px; }
      .cr { width: 100%; max-width: 1120px; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 14px; min-height: 0; }
      .crsum, .crmain { background: var(--solid); border: 1px solid var(--line); border-radius: var(--r); min-height: 0; }
      .crsum { padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
      .crsum .who { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .crsum .nm { font-size: 19px; font-weight: 700; text-align: center; letter-spacing: -0.02em; line-height: 1.2; overflow-wrap: anywhere; }
      .crsum .sub { color: var(--dim); font-size: 12.5px; text-align: center; margin-top: 2px; }
      .crsum .meters { display: flex; flex-direction: column; gap: 8px; }
      .crsum .chips { justify-content: center; }
      .meter { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
      .meter b { font-size: 14.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .meter span { color: var(--faint); font-size: 12px; margin-left: 6px; white-space: nowrap; }
      .meter .bar { margin-top: 8px; }
      .meter.over { border-color: rgba(248, 113, 113, 0.6); }
      .meter.over b, .meter.over span { color: var(--bad); }
      .state { margin-top: auto; height: 34px; border-radius: 10px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); }
      .state.ok { color: var(--good); background: rgba(74, 222, 128, 0.08); border-color: rgba(74, 222, 128, 0.35); }
      .state.bad { color: var(--bad); background: rgba(248, 113, 113, 0.08); border-color: rgba(248, 113, 113, 0.4); }
      .crmain { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
      .crhead { display: flex; align-items: center; padding: 14px 14px 6px 20px; }
      .crt { flex: 1; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
      .crrail { display: flex; gap: 6px; padding: 8px 20px 14px; border-bottom: 1px solid var(--line); }
      .crrail button { flex: 1; min-width: 0; text-align: left; font-size: 11.5px; font-weight: 500; color: var(--faint); padding-top: 8px; border-top: 3px solid var(--raise2); border-radius: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .crrail button.done { border-color: rgba(124, 140, 255, 0.45); color: var(--dim); }
      .crrail button.on { border-color: var(--accent); color: var(--ink); }
      .crbody { flex: 1; overflow-y: auto; padding: 18px 20px 26px; min-height: 0; overscroll-behavior: contain; }
      .crbody h2 { font-size: 17px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
      .crbody .lead { color: var(--dim); margin: 0 0 16px; }
      .crbody .lead b { color: var(--ink); font-weight: 600; }
      .crfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--line); }
      .crfoot .hint { margin: 0; }
      .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
      .opt { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 10px 12px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line); font-size: 13px; transition: border-color 0.15s, background 0.15s; }
      .opt:hover { border-color: var(--line2); }
      .opt.on { border-color: var(--accent); background: var(--accentSoft); }
      .opt.off { opacity: 0.42; cursor: default; }
      .opt.off:hover { border-color: var(--line); }
      .opt b { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; justify-content: space-between; }
      .opt small { color: var(--dim); font-size: 12.5px; line-height: 1.4; }
      .opt small.x { color: var(--faint); font-size: 12px; }
      .opt.race { flex-direction: row; gap: 12px; align-items: flex-start; }
      .opt.race > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .cost { flex: none; font-size: 11px; font-weight: 600; padding: 0 7px; line-height: 18px; border-radius: 99px; background: var(--raise2); color: var(--dim); white-space: nowrap; }
      .cost.pay { background: rgba(248, 113, 113, 0.14); color: var(--bad); }
      .cost.gain { background: rgba(74, 222, 128, 0.13); color: var(--good); }
      .seg.fit { display: inline-flex; max-width: 100%; }
      .field { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; align-items: center; margin-bottom: 14px; }
      .field > label, .field > .l { color: var(--dim); font-size: 13px; }
      .sw { display: flex; gap: 6px; flex-wrap: wrap; }
      .sw button { width: 32px; height: 32px; border-radius: 9px; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14); }
      .sw button.on { border-color: #fff; }
      .stepper { display: inline-flex; align-items: center; gap: 8px; }
      .stepper span { min-width: 120px; text-align: center; font-weight: 500; }
      .inrow { display: flex; gap: 8px; }
      .crbody input[type='text'] { width: 100%; min-width: 0; height: 40px; padding: 0 12px; border-radius: 10px; background: var(--raise); border: 1px solid var(--line); font: inherit; font-size: 15px; color: var(--ink); }
      .crbody input[type='text']:focus { outline: none; border-color: var(--accent); background: var(--raise2); }
      .crbody input[type='range'] { width: 100%; accent-color: var(--accent); }
      .skrow { display: grid; grid-template-columns: 84px minmax(0, 1fr) 48px auto 112px; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
      .skrow > span:first-child { color: var(--dim); }
      .skrow b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
      .skrow b small { color: var(--accent2); font-weight: 500; }
      .skrow .pm { display: flex; gap: 4px; }
      .skrow .pasb { text-align: center; padding: 3px 6px; }
      .pips { display: flex; gap: 2px; }
      .pips i { flex: 1; height: 8px; border-radius: 2px; background: var(--raise2); }
      .pips i.b { background: var(--faint); }
      .pips i.a { background: var(--accent); }
      .errs, .okay { border-radius: 12px; padding: 10px 14px; margin: 0 0 16px; font-size: 13px; }
      .errs { border: 1px solid rgba(248, 113, 113, 0.5); background: rgba(248, 113, 113, 0.08); color: #fca5a5; }
      .errs div + div { margin-top: 3px; }
      .okay { border: 1px solid rgba(74, 222, 128, 0.4); background: rgba(74, 222, 128, 0.07); color: var(--good); }
      .sendrow { display: flex; justify-content: center; margin-top: 22px; }

      /* Phones: panels become bottom sheets, the map stays free above them. */
      @media (max-width: 760px) {
        #top { left: 8px; right: 8px; top: 8px; padding: 8px 10px; column-gap: 10px; max-width: none; }
        #top .brand { display: none; }
        #cstats { gap: 10px; font-size: 12px; flex-basis: 100%; overflow: hidden; }
        #top .seg { flex-basis: 100%; }
        #top .seg button { flex: 1; padding: 0 4px; }
        #side { left: 0; right: 0; bottom: 0; top: auto; width: auto; height: 46vh; border-radius: 18px 18px 0 0; border-bottom: 0; }
        #side.shut { height: auto; }
        #side .dh { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px) * 0); }
        #side.shut .dh { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
        #card { left: 0; right: 0; bottom: 0; top: auto; width: auto; height: 66vh; border-radius: 18px 18px 0 0; border-bottom: 0; z-index: 4; }
        .db { padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
        #mine { top: auto; right: auto; left: 50%; transform: translateX(-50%); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 1; height: 42px; }
        #toast { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
        #memorial { left: 8px; right: 8px; transform: none; width: auto; max-width: none; }
        #creator { padding: 0; }
        .cr { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 0; }
        .crsum, .crmain { border-radius: 0; border-width: 0; }
        .crsum { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 14px; gap: 6px 10px; border-bottom: 1px solid var(--line); overflow: visible; }
        .crsum .who { flex-direction: row; flex: 1 1 100%; gap: 12px; }
        .crsum .who svg.pt { width: 60px; height: 60px; }
        .crsum .nm { font-size: 15px; text-align: left; }
        .crsum .sub { text-align: left; }
        .crsum .meters { flex-direction: row; flex: 1 1 100%; gap: 6px; }
        .crsum .chips, .crsum .state { display: none; }
        .meter { flex: 1; padding: 5px 9px; min-width: 0; }
        .meter b { font-size: 12.5px; display: block; }
        .meter span { margin-left: 0; font-size: 11px; }
        .meter .bar { display: none; }
        .crhead { padding: 8px 10px 0 14px; }
        .crt { font-size: 15px; }
        .crrail { padding: 6px 14px 10px; gap: 4px; }
        .crrail button { font-size: 0; }
        .crrail button.on { font-size: 11.5px; flex: 4; }
        .crbody { padding: 14px 14px 22px; }
        .crfoot { padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); }
        .opts { grid-template-columns: minmax(0, 1fr); }
        .field { grid-template-columns: 78px minmax(0, 1fr); }
        .stepper span { min-width: 96px; }
        .skrow { grid-template-columns: 62px minmax(0, 1fr) 34px auto 84px; gap: 5px; font-size: 12.5px; }
        .skrow .pasb { font-size: 11px; padding: 3px 2px; }
      }
          .nudges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
      .nudges .btn:disabled { opacity: 0.4; cursor: default; }
      .pips { display: flex; align-items: center; gap: 5px; margin: 2px 0 6px; }
      .pips i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line2); }
      .pips i.on { background: var(--accent); border-color: var(--accent); }
      .pips .hint { margin-left: 8px; }
      #worldbtn { position: fixed; top: 66px; right: 12px; z-index: 2; height: 36px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 13px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: var(--shadow); }
      #worldbtn:hover { border-color: var(--line2); }
      #world { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(5, 7, 12, 0.6); padding: 12px; }
      .wbox { width: min(680px, 100%); max-height: calc(100vh - 24px); overflow: auto; padding: 14px 16px 16px; }
      .whead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
      .whead b { font-size: 17px; } .whead span { color: var(--dim); flex: 1; } .whead .icon { align-self: center; }
      .wmapbox { position: relative; }
      .wmap { width: 100%; height: auto; display: block; border-radius: 12px; background: #0e1420; border: 1px solid var(--line); }
      .wlabel { position: absolute; transform: translate(-50%, 0); padding: 1px 7px; border-radius: 6px; background: rgba(13, 17, 26, 0.72); color: var(--ink); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
      .wlabel.here { background: var(--accent); color: var(--accentInk); } .wlabel.dead { color: var(--faint); font-weight: 500; }
      @media (max-width: 640px) { .wlabel { font-size: 10px; padding: 0 5px; } }
      .wmap .road { stroke: rgba(255, 255, 255, 0.16); stroke-width: 1.5; stroke-dasharray: 3 4; }
      .wmap .site { cursor: pointer; } .wmap .site circle { fill: #8b97b4; stroke: #0e1420; stroke-width: 2; }
      .wmap .site.here circle { fill: var(--accent); } .wmap .site.dead circle { fill: #3a4257; }
      .wmap .site circle.mine { fill: none; stroke: var(--accent2); stroke-width: 1.5; }
      .wmap text { fill: var(--dim); font-size: 11px; text-anchor: middle; font-family: var(--font); } .wmap .site.here text { fill: var(--ink); font-weight: 600; }
      .wlist { display: grid; gap: 6px; margin-top: 10px; }
      .wrow { display: grid; text-align: left; gap: 1px; padding: 9px 12px; border-radius: 10px; background: var(--raise); border: 1px solid var(--line); }
      .wrow:hover { background: var(--raise2); } .wrow.here { border-color: rgba(124, 140, 255, 0.5); }
      .wrow span { color: var(--dim); font-size: 12.5px; }
      @media (max-width: 640px) { #worldbtn { top: auto; bottom: calc(112px + env(safe-area-inset-bottom, 0px)); right: 8px; } }
      .askbox { display: grid; gap: 6px; margin: 12px 0 4px; padding: 12px 14px; border-radius: 12px; background: var(--accentSoft); border: 1px solid rgba(124, 140, 255, 0.45); }
      .askbox b { font-size: 14.5px; }
      .diary { padding: 12px 14px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line); font-style: italic; color: var(--dim); }
      .diary p { margin: 4px 0; } .diary .y { font-style: normal; font-size: 11.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; }
      .crroom { margin: 0 0 14px; padding: 10px 14px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line); color: var(--dim); }
      .crroom.full { background: rgba(248, 113, 113, 0.1); border-color: rgba(248, 113, 113, 0.45); color: var(--ink); }
      .crroom a { color: var(--accent2); text-decoration: underline; }
      .skdo { grid-column: 1 / -1; display: block; color: var(--faint); font-size: 12px; line-height: 1.4; margin: -2px 0 8px; }
      .skrow .skdo { flex-basis: 100%; margin: 2px 0 2px; }
      /* The shared colony keeps its own time: no speed buttons */
      body.live #speed { display: none; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <header id="top" class="panel">
      <span class="brand">Hollow Lands</span>
      <span id="cname"></span>
      <span id="cdate"></span>
      <span id="cstats"></span>
      <div id="speed" class="seg" role="group" aria-label="Game speed">
        <button data-speed="0" title="Pause (space)">Pause</button>
        <button data-speed="1" title="Real pace: a game day takes 24 minutes">1&times;</button>
        <button data-speed="6">6&times;</button>
        <button data-speed="60">60&times;</button>
        <button data-speed="600" title="About two and a half game days a second">600&times;</button>
      </div>
    </header>
    <aside id="side" class="panel">
      <div class="dh">
        <nav id="tabs" class="seg" aria-label="Colony panels">
          <button data-tab="feed">Feed</button>
          <button data-tab="people">People</button>
          <button data-tab="colony">Colony</button>
        </nav>
        <button class="icon" id="sfold" title="Hide or show this panel" aria-label="Hide or show this panel">&#x2013;</button>
      </div>
      <div class="db" id="sbody"></div>
    </aside>
    <aside id="card" class="panel hidden">
      <div class="dh"><span class="t" id="ctitle"></span><button class="icon" id="cclose" title="Close" aria-label="Close">&times;</button></div>
      <div class="db" id="cbody"></div>
    </aside>
    <button id="mine" class="hidden">Make your colonist</button>
    <button id="worldbtn" class="hidden">World</button>
    <div id="memorial" class="panel hidden"></div>
    <div id="toast" class="panel off" role="status"></div>
    <div id="loading">HOLLOW LANDS<small id="loadmsg"></small></div>
    <script type="module" src="/src/hollowlands/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Galactic Battler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
      /* dvh follows the phone's visible area (the address bar comes and goes); vh is the fallback. */
      /* The frame keeps clear of phone notches; the game is centred inside #app. */
      #frame {
        width: 100vw; height: 100vh; height: 100dvh;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      #app { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; outline: 1px solid #1a2140; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10; background: #05060f; color: #ffd166;
        font: 12px/2 "Press Start 2P", monospace; text-align: center; align-items: center; justify-content: center;
        padding: 24px; box-sizing: border-box;
      }
      #rotate span { color: #7fe7ff; display: block; font-size: 32px; margin-bottom: 16px; }
      /* Phones held upright: the game is landscape-only. */
      @media (orientation: portrait) and (max-width: 600px) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="frame"><div id="app"></div></div>
    <div id="rotate"><div><span>&#8635;</span>Turn your phone sideways to play</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

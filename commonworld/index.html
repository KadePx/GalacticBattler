<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#14110d" />
    <title>Commonworld</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #f1e6cf;
        --dim: #b0a084;
        --faint: #7d6f59;
        --panel: rgba(24, 20, 15, 0.94);
        --panel2: #2a231a;
        --line: #43382a;
        --gold: #e3b65c;
        --red: #d9694f;
        --green: #8fbf6a;
        --head: 'Cormorant Garamond', Georgia, serif;
        --body: 'EB Garamond', Georgia, serif;
        --tl: 64px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0d1b2b; color: var(--ink); font: 15px/1.45 var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      input { font: inherit; color: var(--ink); }
      a { color: var(--gold); text-decoration: none; } a:hover { text-decoration: underline; }
      a.chip { color: var(--ink); }
      .hidden { display: none !important; }
      #map { position: fixed; inset: 0; }
      #map canvas { display: block; }

      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45); backdrop-filter: blur(6px); }
      .chip { display: inline-block; padding: 1px 9px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); font-size: 13px; margin: 0 4px 4px 0; }
      .btn { padding: 5px 12px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
      .btn:hover { border-color: var(--faint); }
      .btn.on { border-color: var(--gold); color: var(--gold); }
      .icon { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); font-size: 15px; }

      #top { position: fixed; top: 12px; left: 12px; padding: 8px 16px 9px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; max-width: calc(100vw - 24px); }
      #top .brand { font: 700 15px var(--head); letter-spacing: 3px; color: var(--gold); }
      #year { font: 700 24px var(--head); }
      #year.past { color: var(--gold); }
      #wstats { color: var(--dim); font-size: 14px; }

      #modes { position: fixed; top: 12px; right: 12px; padding: 5px; display: flex; gap: 4px; }
      #modes .btn { border-color: transparent; background: none; }
      #modes .btn.on { border-color: var(--gold); }

      #dock { position: fixed; left: 12px; top: 74px; display: flex; flex-direction: column; gap: 6px; }
      #dock .btn { background: var(--panel); text-align: left; }

      #drawer { position: fixed; right: 12px; top: 64px; bottom: calc(var(--tl) + 24px); width: 400px; display: flex; flex-direction: column; overflow: hidden; }
      #drawer .dh { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
      #drawer .dh .t { font: 700 20px var(--head); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #drawer .db { overflow-y: auto; padding: 10px 14px 24px; flex: 1; min-height: 0; overscroll-behavior: contain; }
      h3 { font: 700 17px var(--head); color: var(--gold); margin: 16px 0 6px; letter-spacing: 0.5px; }

      .row { display: flex; align-items: center; gap: 10px; padding: 6px 6px; border-radius: 8px; cursor: pointer; }
      .row:hover, .row.sel { background: var(--panel2); }
      .row .n { flex: 1; min-width: 0; }
      .row .n b { font-weight: 600; }
      .row .n small { display: block; color: var(--dim); font-size: 12.5px; line-height: 1.2; }
      .row .v { color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; font-size: 14px; }
      .up { color: var(--green); } .down { color: var(--red); }
      .fallen { opacity: 0.5; }
      .search { width: 100%; padding: 7px 10px; border-radius: 8px; background: #1a1611; border: 1px solid var(--line); margin-bottom: 8px; }

      .civhead { display: flex; gap: 14px; align-items: center; }
      .civhead .nm { font: 700 28px/1.05 var(--head); }
      .civhead .sub { color: var(--dim); font-size: 14px; }
      .motto { font-style: italic; color: var(--dim); margin: 8px 0 4px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
      .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
      .stat b { display: block; font: 700 19px var(--head); }
      .stat span { color: var(--dim); font-size: 12px; }
      .chart { width: 100%; height: 120px; display: block; }
      .legend { color: var(--dim); font-size: 12.5px; }
      .legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin: 0 4px 0 8px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      td { padding: 4px 4px; border-bottom: 1px dotted #3a3125; }
      td.r { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
      tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel2); }

      .cen { font: 700 15px var(--head); color: var(--faint); letter-spacing: 1px; margin: 14px 0 4px; text-transform: uppercase; }
      .ln { display: flex; gap: 8px; padding: 4px 4px; border-radius: 6px; cursor: pointer; }
      .ln:hover { background: var(--panel2); }
      .ln .y { color: var(--faint); font-size: 12.5px; min-width: 34px; text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; }
      .ln .t { flex: 1; }
      .ln.major .t { color: #fff6e2; font-weight: 600; }
      .ln.now { background: rgba(227, 182, 92, 0.14); }
      .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
      .more { display: block; margin: 12px auto; }

      #inspect { position: fixed; left: 12px; bottom: calc(var(--tl) + 24px); width: 300px; padding: 10px 14px 12px; }
      #inspect .x { position: absolute; right: 8px; top: 6px; color: var(--dim); font-size: 18px; }
      #inspect .h { font: 700 19px var(--head); margin-right: 18px; }
      .kv { display: grid; grid-template-columns: 96px 1fr; gap: 1px 8px; font-size: 14px; margin-top: 4px; }
      .kv div:nth-child(odd) { color: var(--dim); }

      #tip { position: fixed; pointer-events: none; padding: 4px 9px; font-size: 13.5px; border-radius: 6px; background: rgba(15, 12, 9, 0.92); border: 1px solid var(--line); white-space: nowrap; z-index: 5; }

      #timeline { position: fixed; left: 12px; right: 12px; bottom: 12px; height: var(--tl); display: flex; align-items: center; gap: 10px; padding: 0 12px; }
      #track { position: relative; flex: 1; height: 40px; cursor: pointer; touch-action: none; }
      #track .rail { position: absolute; left: 0; right: 0; top: 23px; height: 4px; border-radius: 2px; background: #3a3125; }
      #track .fill { position: absolute; left: 0; top: 23px; height: 4px; border-radius: 2px; background: var(--gold); }
      #track .knob { position: absolute; top: 17px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--gold); border: 2px solid #1a140c; box-shadow: 0 0 0 3px rgba(227, 182, 92, 0.25); }
      #track .mk { position: absolute; top: 8px; width: 3px; height: 10px; margin-left: -1px; border-radius: 1px; opacity: 0.85; }
      #track .ticks { position: absolute; left: 0; right: 0; top: 30px; height: 12px; color: var(--faint); font-size: 11px; }
      #track .ticks span { position: absolute; transform: translateX(-50%); }
      #tyear { font: 700 18px var(--head); min-width: 74px; text-align: center; }
      #live.on { background: #5b2b1f; border-color: var(--red); color: #ffd7c9; }
      #speed { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; color: var(--ink); }

      #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0d1b2b; z-index: 10; font: 700 22px var(--head); letter-spacing: 2px; color: var(--gold); }

      @media (max-width: 760px) {
        :root { --tl: 56px; }
        #top { right: 12px; padding: 6px 12px; gap: 8px; }
        #year { font-size: 20px; }
        #wstats { font-size: 12.5px; flex-basis: 100%; }
        #modes { top: auto; bottom: calc(var(--tl) + 22px); right: 12px; left: 12px; justify-content: space-between; overflow-x: auto; }
        #modes .btn { padding: 4px 8px; font-size: 13px; }
        #dock { top: auto; bottom: calc(var(--tl) + 72px); flex-direction: row; }
        #drawer { left: 0; right: 0; bottom: 0; top: 40%; width: auto; border-radius: 14px 14px 0 0; z-index: 4; }
        #inspect { left: 12px; right: 12px; width: auto; bottom: calc(var(--tl) + 72px); z-index: 3; }
        #timeline { gap: 6px; padding: 0 8px; }
        #tyear { min-width: 56px; font-size: 15px; }
        #speed { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="top" class="panel">
      <span class="brand">COMMONWORLD</span>
      <span id="year">Year 0 AW</span>
      <span id="wstats"></span>
    </div>
    <div id="modes" class="panel"></div>
    <div id="dock">
      <button class="btn" data-open="peoples">⚑ Peoples</button>
      <button class="btn" data-open="chron">✎ Chronicle</button>
    </div>
    <aside id="drawer" class="panel hidden">
      <div class="dh"><button class="icon" id="dback" title="Back">‹</button><span class="t" id="dtitle"></span><button class="icon" id="dclose" title="Close">✕</button></div>
      <div class="db" id="dbody"></div>
    </aside>
    <div id="inspect" class="panel hidden"></div>
    <div id="tip" class="hidden"></div>
    <footer id="timeline" class="panel">
      <button class="icon" id="play" title="Play / pause the world">❚❚</button>
      <select id="speed" title="World speed">
        <option value="1">1 yr/s</option>
        <option value="5" selected>5 yr/s</option>
        <option value="20">20 yr/s</option>
        <option value="60">60 yr/s</option>
      </select>
      <button class="icon" id="replay" title="Replay history from the start">⟲</button>
      <div id="track"><div class="rail"></div><div class="fill"></div><div id="marks"></div><div class="ticks"></div><div class="knob"></div></div>
      <span id="tyear">0</span>
      <button class="btn" id="live">LIVE</button>
    </footer>
    <div id="loading">COMMONWORLD</div>
    <script type="module" src="/src/commonworld/main.ts"></script>
  </body>
</html>
